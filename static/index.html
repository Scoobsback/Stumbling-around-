<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stumble</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f1efe8; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .phone { max-width: 360px; width: 100%; }
    .card { background: white; border-radius: 20px; border: 1px solid #e0ded5; overflow: hidden; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #e0ded5; font-size: 14px; font-weight: 500; }
    .hint { font-size: 11px; color: #888780; }
    .image { height: 170px; background: #e6f1fb; display: flex; align-items: center; justify-content: center; font-size: 40px; }
    .content { padding: 14px 16px 6px; }
    .tag { display: inline-block; background: #e6f1fb; color: #0c447c; font-size: 12px; padding: 2px 10px; border-radius: 20px; margin-bottom: 8px; }
    .title { font-size: 16px; font-weight: 500; margin: 0 0 4px; }
    .excerpt { font-size: 13px; color: #5f5e5a; margin: 0; line-height: 1.5; }
    .domain { font-size: 12px; color: #888780; margin: 8px 0 0; }
    .buttons { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 16px; }
    button { border-radius: 50%; border: 1px solid #b4b2a9; background: white; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-side { width: 48px; height: 48px; font-size: 20px; }
    .btn-main { width: 64px; height: 64px; font-size: 26px; background: #2c2c2a; color: white; border: none; }
    .footer-note { text-align: center; font-size: 11px; color: #888780; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="card">
      <div class="header">
        <span>&#9776;</span>
        <span>stumble</span>
        <span class="hint" id="taste-hint"></span>
      </div>
      <div class="image" id="card-image">&#128247;</div>
      <div class="content">
        <span class="tag" id="card-tag"></span>
        <p class="title" id="card-title">Loading...</p>
        <p class="excerpt" id="card-excerpt"></p>
        <p class="domain" id="card-domain"></p>
      </div>
      <div class="buttons">
        <button class="btn-side" id="btn-down" aria-label="skip">&#128078;</button>
        <button class="btn-main" id="btn-stumble" aria-label="stumble">&#128256;</button>
        <button class="btn-side" id="btn-up" aria-label="like">&#128077;</button>
      </div>
    </div>
    <p class="footer-note">connected to the real backend -- your likes are saved and will still be there next time you open this on the same phone</p>
  </div>

  <script>
    var deviceId = localStorage.getItem('stumble_device_id');
    if (!deviceId) {
      deviceId = 'device-' + Math.random().toString(36).slice(2) + Date.now();
      localStorage.setItem('stumble_device_id', deviceId);
    }

    var current = null;

    function loadNext() {
      fetch('/api/stumble?device=' + encodeURIComponent(deviceId))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.error) {
            document.getElementById('card-title').textContent = "You've seen everything -- check back after the next ingest run.";
            document.getElementById('card-excerpt').textContent = '';
            document.getElementById('card-domain').textContent = '';
            document.getElementById('card-tag').textContent = '';
            current = null;
            return;
          }
          current = data;
          document.getElementById('card-title').textContent = data.title;
          document.getElementById('card-excerpt').textContent = data.excerpt || '';
          document.getElementById('card-domain').textContent = (new URL(data.url)).hostname;
          document.getElementById('card-tag').textContent = data.tags[0] || '';
        });
    }

    function react(reaction) {
      if (!current) return;
      fetch('/api/react?device=' + encodeURIComponent(deviceId), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_id: current.id, reaction: reaction, tags: current.tags })
      }).then(loadNext);
    }

    document.getElementById('btn-stumble').addEventListener('click', loadNext);
    document.getElementById('btn-up').addEventListener('click', function() { react('up'); });
    document.getElementById('btn-down').addEventListener('click', function() { react('down'); });

    loadNext();
  </script>
</body>
</html>
